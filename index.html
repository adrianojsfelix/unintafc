<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>UFS Fighter</title>
<style>
  :root { --bg: #0d0b14; --fg: #e9e4f5; --muted: #8d86a3; --accent: #c8202f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; max-width: 1152px;
    aspect-ratio: 384 / 224; background: #000; box-shadow: 0 0 0 2px #2a2438; }
  .help { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; max-width: 1152px; }
  .help b { color: var(--fg); }
  .touch { display: none; width: 100%; max-width: 640px; justify-content: space-between; gap: 12px; user-select: none; }
  .touch .pad, .touch .acts { display: flex; gap: 10px; }
  .touch button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3a3150; background: #1b1626;
    color: var(--fg); font-size: 20px; font-weight: bold; touch-action: none; }
  .touch button.act { background: var(--accent); border-color: #ff5a64; }
  @media (pointer: coarse) { .touch { display: flex; } .help .kb { display: none; } }
</style>
</head>
<body>
<canvas id="game" width="384" height="224"></canvas>
<div class="touch" id="touch">
  <div class="pad">
    <button data-k="KeyA">◀</button><button data-k="KeyW">▲</button><button data-k="KeyD">▶</button>
  </div>
  <div class="acts">
    <button data-k="KeyS">▼</button><button class="act" data-k="KeyJ">P</button>
  </div>
</div>
<p class="help">
  <span class="kb"><b>P1</b> A/D andar · W pular · S agachar · J soco · segurar <b>para trás</b> = defesa<br>
  <b>P2</b> setas · Enter soco (aperte qualquer tecla do P2 para assumir a CPU)<br></span>
  <b>1</b> CPU ativa/boneco de treino · <b>H</b> mostrar hitboxes · <b>R</b> reiniciar round
</p>
<script src="src/game.js"></script>
</body>
</html>
