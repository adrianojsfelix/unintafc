<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio de Poses</title>
<style>
  :root { --bg: #14111c; --panel: #1e1a29; --line: #352e47; --fg: #ece8f4; --muted: #9a92b2; --accent: #b0343a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    padding: 16px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .08em; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .cell { background: var(--panel); border: 1px solid var(--line); padding: 6px; cursor: pointer; text-align: center; }
  .cell.sel { border-color: var(--accent); }
  .cell canvas { display: block; image-rendering: pixelated; width: 150px; height: 136px; background: #cfd3e4; }
  .editor { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
  .editor canvas { image-rendering: pixelated; width: 450px; max-width: 100%; height: auto; background: #cfd3e4; }
  .sliders { display: grid; grid-template-columns: 110px 1fr 48px; gap: 4px 8px; align-items: center; min-width: 0; }
  .sliders input { width: 100%; }
  textarea { width: 100%; height: 70px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: inherit; }
  @media (max-width: 760px) { .editor { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>GABY · ESTÚDIO DE POSES</h1>
<div class="grid" id="grid"></div>
<div class="editor">
  <canvas id="big" width="150" height="136"></canvas>
  <div>
    <div class="sliders" id="sliders"></div>
    <p>Pose atual (copie para <code>GABY_POSES</code> em src/rig.js):</p>
    <textarea id="out" readonly></textarea>
  </div>
</div>
<script src="src/rig.js"></script>
<script>
(async () => {
  const heads = await Rig.loadHeads();
  const grid = document.getElementById("grid"), big = document.getElementById("big");
  const names = Object.keys(Rig.GABY_POSES);
  let current = names[0], pose = {};

  const draw = (canvas, p) => {
    const r = Rig.render(p, heads), g = canvas.getContext("2d");
    g.clearRect(0, 0, canvas.width, canvas.height);
    const tmp = document.createElement("canvas"); tmp.width = Rig.CW; tmp.height = Rig.CH;
    tmp.getContext("2d").putImageData(r.image, 0, 0);
    g.fillStyle = "rgba(40,40,70,.25)"; g.beginPath(); g.ellipse(Rig.AX, Rig.GY + 1, 22, 3, 0, 0, 7); g.fill();
    g.drawImage(tmp, 0, 0);
  };

  names.forEach(n => {
    const cell = document.createElement("div"); cell.className = "cell"; cell.dataset.n = n;
    const c = document.createElement("canvas"); c.width = Rig.CW; c.height = Rig.CH;
    cell.append(c, n); grid.append(cell);
    draw(c, Rig.GABY_POSES[n]);
    cell.onclick = () => select(n);
  });

  const FIELDS = [
    ["lean", -40, 40], ["tilt", -40, 40], ["rot", -180, 180], ["lift", 0, 60], ["flow", -10, 10],
    ["armF.0", -180, 180], ["armF.1", -180, 180], ["armB.0", -180, 180], ["armB.1", -180, 180],
    ["legF.0", -120, 140], ["legF.1", -10, 150], ["legB.0", -120, 140], ["legB.1", -10, 150],
  ];
  const sliders = document.getElementById("sliders");
  const get = (p, k) => { const [a, i] = k.split("."); return i ? p[a][+i] : p[a]; };
  const set = (p, k, v) => { const [a, i] = k.split("."); if (i) p[a][+i] = v; else p[a] = v; };
  const inputs = {};
  FIELDS.forEach(([k, lo, hi]) => {
    const lab = document.createElement("label"); lab.textContent = k; lab.htmlFor = "s-" + k;
    const inp = document.createElement("input"); inp.type = "range"; inp.min = lo; inp.max = hi; inp.id = "s-" + k;
    const val = document.createElement("span");
    inp.oninput = () => { set(pose, k, +inp.value); val.textContent = inp.value; refresh(); };
    inputs[k] = [inp, val];
    sliders.append(lab, inp, val);
  });

  function refresh() {
    draw(big, pose);
    const cell = grid.querySelector(`[data-n="${current}"] canvas`); draw(cell, pose);
    const compact = Object.fromEntries(Object.entries(pose).filter(([k, v]) => JSON.stringify(v) !== JSON.stringify(Rig.DEFAULT[k]) || k.startsWith("arm") || k.startsWith("leg")));
    document.getElementById("out").value = `${current}: ${JSON.stringify(compact).replace(/"(\w+)":/g, "$1: ")},`;
  }
  function select(n) {
    current = n;
    pose = JSON.parse(JSON.stringify(Object.assign({}, Rig.DEFAULT, Rig.GABY_POSES[n])));
    grid.querySelectorAll(".cell").forEach(c => c.classList.toggle("sel", c.dataset.n === n));
    FIELDS.forEach(([k]) => { inputs[k][0].value = get(pose, k); inputs[k][1].textContent = get(pose, k); });
    refresh();
  }
  select(names[0]);
})();
</script>
</body>
</html>
